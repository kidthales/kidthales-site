name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-agent-files:
    name: No tracked agent files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if agent or learnings paths are tracked
        run: |
          bad=$(git ls-files | grep -E '^(\.agents?/|\.gemini/|\.ai/|\.cursor/|\.claude/|docs/learnings/|AGENTS\.md$|GEMINI\.md$|CLAUDE\.md$)' || true)
          if [ -n "$bad" ]; then
            echo "Agent or learnings files must not be tracked in a public repo:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no agent or learnings files are tracked."

  build:
    name: Check, build and route parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build (must finish in under 15 seconds)
        run: |
          start=$(date +%s)
          npm run build
          elapsed=$(( $(date +%s) - start ))
          echo "Build took ${elapsed}s"
          if [ "$elapsed" -ge 15 ]; then echo "Build exceeded 15 seconds"; exit 1; fi
      - run: npm run check:routes
      - run: npm test

  notify:
    name: Notify
    if: always()
    needs: [no-agent-files, build]
    runs-on: ubuntu-latest
    steps:
      - name: Post consolidated status to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RESULTS: ${{ join(needs.*.result, ',') }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No webhook configured; skipping."; exit 0; fi
          case "$RESULTS" in
            *failure*) title="CI failed"; color=15088454 ;;
            *cancelled*) title="CI cancelled"; color=15088454 ;;
            *) title="CI passed"; color=4388484 ;;
          esac
          curl -sS -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$title\",\"description\":\"$REPO ($REF)\\n[View run]($RUN_URL)\",\"color\":$color}]}" "$WEBHOOK"
