name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-agent-files:
    name: No tracked agent files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if agent or learnings paths are tracked
        run: |
          bad=$(git ls-files | grep -E '^(\.agents?/|\.gemini/|\.ai/|\.cursor/|\.claude/|scratch/|docs/learnings/|AGENTS\.md$|GEMINI\.md$|CLAUDE\.md$)' || true)
          if [ -n "$bad" ]; then
            echo "Agent or learnings files must not be tracked in a public repo:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no agent or learnings files are tracked."

  build:
    name: Check, build and route parity (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build (must finish in under 15 seconds)
        run: |
          start=$(date +%s)
          npm run build
          elapsed=$(( $(date +%s) - start ))
          echo "Build took ${elapsed}s"
          if [ "$elapsed" -ge 15 ]; then echo "Build exceeded 15 seconds"; exit 1; fi
      - run: npm run check:routes
      - if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
      - run: npm test

  notify:
    name: Discord CI Notification
    if: always()
    needs: [no-agent-files, build]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch consolidated status card to #dev-ci-builds
        if: env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=2263091
            TITLE="✅ CI Passed — kidthales-site"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=11184810
            TITLE="⚪ CI Cancelled — kidthales-site"
          else
            COLOR=15087942
            TITLE="❌ CI Failed — kidthales-site"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            --argjson color "$COLOR" \
            '{
              username: "kidthales CI",
              avatar_url: "https://kidthales.com/favicon-96x96.png",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true }
                ],
                footer: {
                  text: "GitHub Actions • kidthales-site",
                  icon_url: "https://kidthales.com/favicon-96x96.png"
                }
              }]
            }' | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
